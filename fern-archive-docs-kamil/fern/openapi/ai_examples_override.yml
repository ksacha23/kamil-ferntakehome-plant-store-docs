paths:
  /plant:
    post:
      x-fern-examples:
        - request:
            name: "Fern"
            category: "Indoor"
            tags: ["green", "leafy"]
            status: "available"
          response:
            body:
              id: 101
              name: "Fern"
              status: "available"
              tags: ["green", "leafy"]
          code-samples:
            - language: python
              code: |
                import requests

                response = requests.post(
                    "https://api.plantstore.dev/v3/plant",
                    json={
                        "name": "Fern",
                        "category": "Indoor",
                        "tags": ["green", "leafy"],
                        "status": "available"
                    }
                )
                print(response.json())
  /user/username:
    get:
      x-fern-examples:
        - path-parameters:
            username: username
          response:
            body:
              id: 42
              username: green_thumb99
              email: green.thumb99@plantmail.com
